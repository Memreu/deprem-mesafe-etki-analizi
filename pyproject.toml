[project]
name = "mmi-mapper"
version = "0.1.0"
description = "Türkiye odaklı, belgelenmiş ve doğrulanmış hızlı deprem şiddeti (MMI) tahmini"
authors = [{ name = "Mehmet Emre Ünlü" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mmi_mapper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
