[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmi-mapper"
version = "0.2.0"
description = "Türkiye odaklı, belgelenmiş ve doğrulanmış hızlı deprem şiddeti (MMI) tahmini"
readme = "README.md"
authors = [{ name = "Mehmet Emre Ünlü" }]
license = { text = "MIT" }
requires-python = ">=3.10"
# OpenQuake hazardlib, GDAL derlemesini atlamak için ayrıca bağımlılıksız kurulur:
#   pip install --no-deps openquake.engine==3.26.2
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj~=3.7.2",
    "folium>=0.17",
    "rasterio>=1.3",
    "matplotlib>=3.8",
    "geonamescache>=2.0",
    # OpenQuake hazardlib çalışma zamanı bağımlılıkları
    "h5py>=3.10",
    "toml",
    "decorator",
    "psutil",
    "numba>=0.59",
    "alpha_shapes",
    "h3>=4",
    "requests",
    "fiona>=1.9",
    "geopandas>=0.14",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45"]
app = ["streamlit>=1.35"]
dev = ["mmi-mapper[ml,app]", "pytest>=8", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
mmi-mapper = "mmi_mapper.cli:main"

[project.urls]
Repository = "https://github.com/Memreu/deprem-mesafe-etki-analizi"

[tool.setuptools]
packages = ["mmi_mapper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
